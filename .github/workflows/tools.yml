name: Tools

on:
  push:
    branches:
      - 'master'
      - 'release/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'master'
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    # 35 has glibc-2.34, compatible >= el9, fc >= 35, ubuntu >= 22.04
    container: fedora:35
    steps:
      - name: Install build deps
        run: |
          dnf groupinstall -y "Development Tools"
          dnf install -y dbus-devel audit-libs-devel clang

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Build tools
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --bins --release

      - name: Export files
        run: |
          mkdir /tmp/tools
          mv target/release/tdb /tmp/tools/tdb
          mv target/release/rulec /tmp/tools/rulec
          mv target/release/faprofiler /tmp/tools/faprofiler

      - name: Archive Tools
        uses: actions/upload-artifact@v4
        with:
          name: fapolicy-analyzer-tools
          path: /tmp/tools/*

      - name: Release artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ steps.tag_name.outputs.VERSION }}
          prerelease: ${{ startsWith(github.ref, 'refs/tags/v0') || contains(github.ref, 'rc') }}
          draft: true
          files: /tmp/tools/*
